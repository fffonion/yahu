name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install cross-compilation deps (Windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Bun install & build
        run: |
          bun install
          bun run build

      - name: Cargo build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (linux)
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/yahu dist/
          cp scripts/png-to-ios-heic.sh dist/
          tar -czf yahu-${{ matrix.target }}.tar.gz -C dist yahu png-to-ios-heic.sh

      - name: Package (windows)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/yahu.exe dist/
          cp scripts/png-to-ios-heic.sh dist/
          zip -j yahu-x86_64-pc-windows-gnu.zip dist/yahu.exe dist/png-to-ios-heic.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yahu-${{ matrix.target }}
          path: yahu-${{ matrix.target }}.*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Bun install & build
        run: |
          bun install
          bun run build

      - name: Cargo build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/yahu dist/
          cp scripts/png-to-ios-heic.sh dist/
          tar -czf yahu-aarch64-apple-darwin.tar.gz -C dist yahu png-to-ios-heic.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yahu-aarch64-apple-darwin
          path: yahu-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-npm:
    if: startsWith(github.ref_name, 'v')
    needs: [build-linux, build-macos, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble npm package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          mkdir -p npm-package/binaries
          cp -R npm/yahu/. npm-package/
          npm pkg set version="$version" --prefix npm-package

          for archive in artifacts/yahu-*.tar.gz; do
            target="$(basename "$archive" .tar.gz)"
            target="${target#yahu-}"
            mkdir -p "npm-package/binaries/$target"
            tar -xzf "$archive" -C "npm-package/binaries/$target" yahu
          done

          archive="artifacts/yahu-x86_64-pc-windows-gnu.zip"
          mkdir -p npm-package/binaries/x86_64-pc-windows-gnu
          unzip -p "$archive" yahu.exe > npm-package/binaries/x86_64-pc-windows-gnu/yahu.exe
          chmod +x npm-package/bin/yahu.js

          test -x npm-package/binaries/x86_64-unknown-linux-gnu/yahu
          test -x npm-package/binaries/aarch64-unknown-linux-gnu/yahu
          test -x npm-package/binaries/aarch64-apple-darwin/yahu
          test -f npm-package/binaries/x86_64-pc-windows-gnu/yahu.exe
          (cd npm-package && npm pack --dry-run)

      - name: Publish @fffonion/yahu to npm (trusted publishing)
        run: |
          set -euo pipefail
          # Trusted publishing needs npm >= 11.5.1; the runner image may lag.
          npm install --global npm@latest
          npm --version
          # No token: npm detects the GitHub OIDC environment and exchanges a
          # short-lived credential for this exact workflow.
          test ! -e npm-package/.npmrc
          npm publish ./npm-package --access public
