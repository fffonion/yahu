name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Public-source privacy checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_privacy.py'
          python3 scripts/check_privacy.py
          python3 -m unittest discover -s android/tests -p 'test_*.py'

      - name: Bun install & build
        run: |
          bun install
          bun run build

      - name: Bun tests
        run: bun test

      - name: Cargo test
        run: cargo test
