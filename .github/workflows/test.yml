name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/.ci/hermes-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check out Hermes Skills dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: 8f05f890c581b729e039e9e636d0df9a92fe6105
          path: .ci/hermes-agent
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/requirements-python.txt

      - name: Install Python integration dependencies
        run: |
          python -m pip install --requirement tests/requirements-python.txt
          python -c "import yaml; import requests; import tools.skills_tool; import agent.skill_utils"

      - name: Public-source privacy checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_privacy.py'
          python3 scripts/check_privacy.py
          python3 -m unittest discover -s android/tests -p 'test_*.py'

      - name: Bun install & build
        run: |
          bun install
          bun run build

      - name: Bun tests
        run: bun test

      - name: Cargo test
        run: cargo test
